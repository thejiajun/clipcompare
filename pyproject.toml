[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clipcompare"
version = "0.2.0"
description = "Comparison videos from two clips — side-by-side, wipe reveal, picture-in-picture."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jiajun Chen" }]
keywords = ["ffmpeg", "video", "comparison", "side-by-side", "wipe", "picture-in-picture", "before-after", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thejiajun/clipcompare"
Repository = "https://github.com/thejiajun/clipcompare"
Issues = "https://github.com/thejiajun/clipcompare/issues"

[project.scripts]
clipcompare = "clipcompare.cli:main"
sbs = "clipcompare.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipcompare = ["assets/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
